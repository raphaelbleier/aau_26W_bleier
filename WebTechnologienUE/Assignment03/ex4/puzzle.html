<html lang="en">
<head>
    <style>
        #puzzleTarget {
            width: 850px;
            height: 534px;
            color: black;
        }

        .puzzlePic {
            width: 400px;
            height: 267px;
            display: inline-block;
        }

        #ul {
            background-color: silver
        }

        #ur {
            background-color: green
        }

        #ll {
            background-color: blue
        }

        #lr {
            background-color: red
        }
    </style>
    <title>Puzzle</title>
    <script src="puzzle.js" defer></script>
</head>

<body>
<h1>Puzzle Game</h1>

<div id="puzzleTarget">
    <div class="puzzlePic" id="ul" data-result="bus-1.jpg"></div>
    <div class="puzzlePic" id="ur" data-result="bus-2.jpg"></div>
    <div class="puzzlePic" id="ll" data-result="bus-3.jpg"></div>
    <div class="puzzlePic" id="lr" data-result="bus-4.jpg"></div>
</div>

<h2>Puzzle Pieces</h2>
<div id="puzzleSource">
    <img src="bus-4.jpg" alt="The back part of the top of a bus.">
    <img src="bus-1.jpg" alt="The front part of the top of a bus.">
    <img src="bus-3.jpg" alt="The back part of the bottom of a bus.">
    <img src="bus-2.jpg" alt="The front part of the bottom of a bus.">
</div>
</body>
</html>
